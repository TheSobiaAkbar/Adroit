name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, publish and create the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Check out (full history, for the forbidden-patterns check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # nothing pushes; keeps the write-scoped token out of .git/config

      - name: Verify the tag, version and CHANGELOG
        run: bash .github/scripts/verify-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Forbidden patterns
        run: bash .github/scripts/forbidden-patterns.sh

      - name: Full CI checks
        run: >-
          ./gradlew build lint apiCheck checkModuleDependencies testDebugUnitTest verifyPublication
          :sample-xml:assembleRelease :sample-compose:assembleRelease
          --stacktrace

      # Public, no credentials needed to download. Secrets: CENTRAL_TOKEN is base64("<user token name>:<user token
      # password>") from central.sonatype.com → View Account → Generate User Token. AUTOMATIC releases the version
      # once Central's checks pass; it cannot be deleted or replaced afterwards.
      - name: Publish to Maven Central
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          ./gradlew centralBundle --stacktrace
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $CENTRAL_TOKEN" \
            --form bundle=@build/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=adroit-${GITHUB_REF_NAME#v}&publishingType=AUTOMATIC"

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Adroit ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
