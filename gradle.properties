# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# CompanyAdMob library coordinates and naming (see docs/architecture/NAMING.md)
companyAdmob.group=com.company
companyAdmob.version=1.0.0-rc1
companyAdmob.resourcePrefix=company_admob_

# POM metadata for the published libraries (docs/architecture/PUBLISHING_NOTES.md). No credentials here: repository
# URLs and credentials come from ~/.gradle/gradle.properties or environment variables.
companyAdmob.pom.url=https://github.com/TheSobiaAkbar/AdsPlugin
companyAdmob.pom.scm.connection=scm:git:https://github.com/TheSobiaAkbar/AdsPlugin.git
# "–" is an en dash: Gradle reads this file as ISO-8859-1.
companyAdmob.pom.license.name=Proprietary – Company internal use
companyAdmob.pom.developer.id=company-mobile
companyAdmob.pom.developer.name=Company Mobile Team
# GitHub Packages repository (owner/repo). A fork can override it with -PcompanyAdmob.github.repository=….
companyAdmob.github.repository=TheSobiaAkbar/AdsPlugin
