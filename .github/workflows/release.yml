name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, publish and create the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the GitHub Release
      packages: write # publish to GitHub Packages
    steps:
      - name: Check out (full history, for the forbidden-patterns check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # nothing pushes; keeps the write-scoped token out of .git/config

      - name: Verify the tag, version and CHANGELOG
        run: bash .github/scripts/verify-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Forbidden patterns
        run: bash .github/scripts/forbidden-patterns.sh

      - name: Full CI checks
        run: >-
          ./gradlew build lint apiCheck checkModuleDependencies testDebugUnitTest verifyPublication
          :sample-xml:assembleRelease :sample-compose:assembleRelease
          --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --stacktrace

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Adroit ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
