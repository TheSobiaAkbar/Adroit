name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out (full history, for the forbidden-patterns check)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Only the default branch writes the cache; pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Forbidden patterns
        run: bash .github/scripts/forbidden-patterns.sh

      - name: Build, lint, unit tests, API, dependency guard, publication and minified samples
        run: >-
          ./gradlew build lint apiCheck checkModuleDependencies testDebugUnitTest verifyPublication
          :sample-xml:assembleRelease :sample-compose:assembleRelease :sample-mixed:assembleRelease
          --stacktrace

      # -PwithMediation applies to the whole Gradle invocation, so the mediation build gets its own run.
      - name: Mediation sample and its dependency guard
        run: ./gradlew :sample-mixed:assembleRelease :sample-mixed:checkModuleDependencies -PwithMediation=true --stacktrace

      - name: Documentation snippets and docs check
        run: |
          ./gradlew -PincludeDocsSnippets :docs-snippets:compileDebugKotlin :docs-snippets:compileDebugJavaWithJavac :docs-snippets:testDebugUnitTest --stacktrace
          node .github/scripts/check-docs.mjs

      - name: Consumer smoke build against mavenLocal
        run: |
          ./gradlew publishToMavenLocal --stacktrace
          ./gradlew -p consumer-smoke assembleDebug verifyConsumerClasspath --stacktrace

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
