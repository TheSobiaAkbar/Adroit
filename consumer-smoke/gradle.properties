# Own settings: this build doesn't read the main build's gradle.properties. Dexing the Google SDKs needs more than
# Gradle's default 512 MB heap.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AGP 9's default; AGP 8 (the compatibility matrix's older rows) needs it spelled out.
android.useAndroidX=true
