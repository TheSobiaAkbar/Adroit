# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Adroit library coordinates and naming (see docs/architecture/NAMING.md)
adroit.group=io.github.thesobiaakbar
adroit.version=1.0.0-rc4
adroit.resourcePrefix=adroit_

# POM metadata for the published libraries (docs/architecture/PUBLISHING_NOTES.md). No credentials here: repository
# URLs and credentials come from ~/.gradle/gradle.properties or environment variables.
adroit.pom.url=https://github.com/TheSobiaAkbar/Adroit
adroit.pom.scm.connection=scm:git:https://github.com/TheSobiaAkbar/Adroit.git
adroit.pom.license.name=Proprietary - licensed to authorized users (see LICENSE)
adroit.pom.developer.id=TheSobiaAkbar
adroit.pom.developer.name=Sobia Akbar
# GitHub Packages repository (owner/repo). A fork can override it with -Padroit.github.repository=...
adroit.github.repository=TheSobiaAkbar/Adroit
